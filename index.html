<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#3a8dff"><link rel="manifest" href="manifest.json"><title>Meet-UP</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--k:#17306b;--bd:0 -4px 0 0 var(--k),0 4px 0 0 var(--k),-4px 0 0 0 var(--k),4px 0 0 0 var(--k)}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none;border-radius:0}
body{margin:0;background:#8fd0ff;font:10px/1.6 "Press Start 2P","Courier New",monospace;font-weight:700;color:var(--k);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px 18px;pointer-events:none}
.ui>*{pointer-events:auto}.hide{display:none!important}#menu{justify-content:space-between}
.ttl{width:min(86vw,520px);image-rendering:pixelated}
.card{background:#f4f9ff;padding:20px;margin:4px;display:flex;flex-direction:column;gap:14px;width:min(92vw,340px);max-height:84vh;overflow:auto;box-shadow:var(--bd),inset 0 -4px 0 #cfe0f7,inset 0 4px 0 #fff;filter:drop-shadow(0 8px 0 #17306b40)}
.card,.card *{touch-action:pan-y}
button{--lo:#1f56c4;--hi:#7ab8ff;font:inherit;font-size:10px;color:#fff;background:#3d8bff;border:0;padding:14px 12px;margin:4px;cursor:pointer;box-shadow:var(--bd),inset 0 -4px 0 var(--lo),inset 0 4px 0 var(--hi);display:flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(3px);filter:brightness(.92)}button:disabled{opacity:.6}
button.s{background:#fff;color:#3d8bff;--lo:#c3d6f3;--hi:#fff}button.d{background:#ff5d5d;--lo:#b32b30;--hi:#ff9a9a}
svg{width:20px;height:20px;fill:currentColor;shape-rendering:crispEdges}
input,select{font:inherit;font-size:10px;color:var(--k);background:#fff;border:0;padding:12px;margin:4px;outline:0;min-width:0;box-shadow:var(--bd),inset 0 4px 0 #cfe0f7}
input:focus{background:#fffbe0}input[type=color]{padding:2px;width:60px;height:36px;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch,input[type=color]::-moz-color-swatch{border:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;padding:0;background:#cfe0f7}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:28px;background:#3d8bff;box-shadow:0 0 0 4px var(--k)}input[type=range]::-moz-range-thumb{width:20px;height:28px;border:0;background:#3d8bff;box-shadow:0 0 0 4px var(--k)}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between}.lbl{font-size:8px;opacity:.6;text-transform:uppercase}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,400px)}.mb .big{grid-column:1/3;font-size:16px;padding:18px}
.code{font-size:22px;letter-spacing:4px;text-align:center;background:#e8f2ff;padding:12px;box-shadow:inset 0 4px 0 #cfe0f7}
#ll{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:10px;background:#e8f2ff;padding:8px 10px}
.row i{width:20px;height:20px;box-shadow:0 0 0 3px var(--k)}.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kick{width:34px;height:34px;padding:0;margin:0;background:#ff5d5d;--lo:#b32b30;--hi:#ff9a9a}
.row .jb{font-size:8px;color:#3d8bff;background:#fff;padding:2px 6px;box-shadow:0 0 0 2px var(--k)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 16px;z-index:9;max-width:90vw;text-align:center;line-height:1.7;box-shadow:0 4px 0 #0005}
#rot{position:fixed;inset:0;z-index:20;background:var(--k);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;line-height:2;padding:20px}#rot svg{width:72px;height:72px;animation:rt 2s steps(4) infinite}@keyframes rt{50%,to{transform:rotate(-90deg)}}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
#hud>*,#mob>*{position:fixed}
.ib{width:44px;height:44px;padding:0;color:#3d8bff;background:#fff;--lo:#c3d6f3;--hi:#fff;margin:0}
#pb{top:max(14px,env(safe-area-inset-top));left:14px}#cb{top:max(14px,env(safe-area-inset-top));left:70px}
#mm{top:max(14px,env(safe-area-inset-top));right:14px;width:104px;height:104px;image-rendering:pixelated;box-shadow:var(--bd)}
#jbhud{top:calc(max(14px,env(safe-area-inset-top)) + 116px);right:14px;background:#f4f9ff;padding:8px 12px;box-shadow:var(--bd);font-size:10px;color:#3d8bff;display:flex;align-items:center;gap:6px}
#jbhud i{display:inline-block;width:14px;height:14px;background:radial-gradient(circle at 35% 30%,#fff,#7fd0ff 60%,#3d8bff);border-radius:50%;box-shadow:0 0 0 2px var(--k)}
#bar{bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;background:#f4f9ff;box-shadow:var(--bd),inset 0 -4px 0 #cfe0f7}
#bar button{position:relative;width:min(9vw,46px);height:min(9vw,46px);padding:5px;margin:0;background:#fff;--lo:#cfe0f7;--hi:#fff}#bar canvas{width:100%;height:100%;image-rendering:pixelated}
#bar small{position:absolute;left:2px;top:0;font-size:7px;color:#3d8bff}#bar .on{background:#ffe27a;transform:translateY(-6px)}
#chat{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 76px);left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(92vw,440px);padding:8px;background:#f4f9ff;box-shadow:var(--bd)}#ci{flex:1}
#joy{left:26px;bottom:90px;width:120px;height:120px;background:#ffffff66;box-shadow:var(--bd)}
#kn{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#3d8bff;box-shadow:var(--bd)}
#jb,#rb{padding:0;font-size:9px}#jb{right:26px;bottom:100px;width:72px;height:72px}#rb{right:34px;bottom:190px;width:56px;height:56px}
#prompt{position:fixed;bottom:230px;left:50%;transform:translateX(-50%);background:rgba(23,48,107,.92);color:#fff;padding:8px 14px;font-size:10px;pointer-events:none;z-index:8;box-shadow:0 4px 0 #0005;white-space:nowrap}
#raceTimer{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#17306b;color:#fff;padding:10px 18px;font-size:16px;pointer-events:none;z-index:8;box-shadow:0 0 0 3px #7fd0ff,0 4px 0 #0005}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{margin:0;padding:10px 2px;font-size:8px;background:#e8f2ff;color:var(--k);--lo:#c3d6f3;--hi:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid button.on{background:#3d8bff;color:#fff;--lo:#1f56c4;--hi:#7ab8ff}
.grid.map{grid-template-columns:1fr 1fr}
.grid.map button{padding:14px 6px;font-size:10px}
.grid.map button.on{background:#ffe27a;color:var(--k);--lo:#d4b23a;--hi:#fff8d0}
#load{background:#8fd0ff}
.loadwrap{background:#f4f9ff;padding:24px 28px;box-shadow:var(--bd),inset 0 -4px 0 #cfe0f7,inset 0 4px 0 #fff;display:flex;flex-direction:column;gap:16px;align-items:center;min-width:min(80vw,340px)}
#loadSpinner{width:40px;height:40px;border:4px solid #cfe0f7;border-top-color:#3d8bff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadbar{width:100%;height:18px;background:#cfe0f7;box-shadow:inset 0 3px 0 #a8b8d8;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:#3d8bff;transition:width .3s}
#loadMsg{font-size:9px;text-align:center;line-height:1.8;color:#17306b;max-width:100%;word-break:break-word;min-height:14px}
@media(orientation:landscape){#skin,#set{align-items:flex-end;padding-right:28px}}
@media(max-height:430px){.ttl{width:min(54vw,330px)}.mb .big{padding:12px;font-size:13px}button{padding:10px}.mb{gap:8px}.card{padding:14px;gap:10px}.grid button{padding:6px 2px}}
#raceTimer{font-size:12px;white-space:nowrap}#rbar{top:56px;left:50%;transform:translateX(-50%);width:min(60vw,360px);height:12px;background:#17306b;box-shadow:0 0 0 3px #7fd0ff;z-index:8;pointer-events:none}#rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff8c1a)}
#cd{top:28%;left:50%;transform:translateX(-50%);font-size:min(18vw,96px);color:#ffd23f;text-shadow:0 6px 0 #17306b;z-index:9;pointer-events:none;animation:cdp .5s steps(5) infinite}@keyframes cdp{50%{transform:translateX(-50%) scale(1.15)}}
#gmsg{position:fixed;top:calc(max(14px,env(safe-area-inset-top)) + 130px);left:14px;max-width:min(46vw,320px);max-height:160px;overflow:hidden;background:rgba(23,48,107,.85);color:#fff;padding:8px 10px;font-size:8px;line-height:1.6;z-index:8;pointer-events:none;box-shadow:0 0 0 2px #7fd0ff,0 4px 0 #0005;backdrop-filter:blur(2px)}
#gmsg .gmsg-row{margin-bottom:3px;word-wrap:break-word;word-break:break-word}
#gmsg .gmsg-row:not(:last-child){border-bottom:1px solid #ffffff18;padding-bottom:3px}
#gmsg .gmsg-row b{color:#ffd23f}
#rankHUD{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#17306b,#3d8bff);color:#fff;padding:8px 20px;font-size:13px;font-weight:bold;box-shadow:0 0 0 3px #ffd23f,0 4px 0 #0005;z-index:9;pointer-events:none;letter-spacing:2px;text-shadow:1px 1px 0 #000}
#rankHUD.hide{display:none}
#rankHUD .p1{color:#ffd23f}#rankHUD .p2{color:#e0e0e0}#rankHUD .p3{color:#cd7f32}
#posList{position:fixed;top:140px;right:14px;background:rgba(23,48,107,.85);color:#fff;padding:6px 8px;font-size:7px;line-height:1.4;z-index:8;pointer-events:none;box-shadow:0 0 0 2px #7fd0ff;min-width:110px;max-width:130px}
#posList.hide{display:none}
#posList .pl{display:flex;justify-content:space-between;gap:6px;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#posList .pl.self{color:#ffd23f;font-weight:bold}
#posList .pl .p{opacity:.7}
#posList .pl .d{opacity:.6;font-size:6px}
@media(max-height:420px){#bar{bottom:8px;padding:6px;gap:5px}#bar button{width:min(7.5vw,38px);height:min(7.5vw,38px)}#jbhud{top:calc(max(14px,env(safe-area-inset-top)) + 116px);padding:6px 9px;font-size:9px}#prompt{bottom:180px;font-size:9px}#gmsg{max-height:120px;font-size:7px}#rankHUD{top:80px;font-size:11px;padding:6px 14px}#posList{top:110px;font-size:6px;min-width:90px}}
#hud #bar .on{box-shadow:var(--bd),inset 0 -4px 0 #d4b23a,0 -6px 0 #ffd23f}
</style></head><body>
<canvas id="c"></canvas><div id="toast" class="hide"></div>
<div id="rot"><svg viewBox="0 0 8 8"><rect x="2" y="0" width="4" height="8"/><rect x="3" y="1" width="2" height="5" fill="#17306b"/></svg>Putar HP ke landscape</div>
<div id="load" class="ui"><div class="loadwrap"><div id="loadSpinner"></div><div id="loadMsg">Memuat...</div><div class="loadbar"><i id="loadBar"></i></div></div></div>
<div id="name" class="ui hide"><canvas class="ttl"></canvas><div class="card"><div class="lbl">Username</div><input id="nm" maxlength="14" placeholder="Nama Jello" autocomplete="off"><button id="ng">Lanjut</button></div></div>
<div id="menu" class="ui hide"><canvas class="ttl"></canvas><div class="mb"><button id="mp" class="big">Play</button><button id="ms" class="s">Custom Skin</button><button id="mr" class="s">Custom Room</button><button id="mt" class="s">Setting</button><button id="md" class="s">Download</button></div></div>
<div id="playpick" class="ui hide"><div class="card"><div class="lbl">Pilih Map</div><div id="playMaps" class="grid map"></div><button class="s" id="ppbk">Kembali</button></div></div>
<div id="skin" class="ui hide"><div class="card"><div class="r">Warna 1<input type="color" id="c1"></div><div class="r">Warna 2<input type="color" id="c2"></div>
<div class="lbl">Bentuk</div><div id="shapes" class="grid"></div>
<div class="lbl">Aksesori</div><div id="hats" class="grid"></div>
<div class="r">Nametag<input type="color" id="nc"></div>
<div class="lbl">Font</div><div id="fonts" class="grid"></div>
<button class="s bk">Kembali</button></div></div>
<div id="croom" class="ui hide"><div class="card"><div class="lbl">Pilih Map</div><div id="maps" class="grid map"></div>
<button id="rc">Buat Room</button><div class="lbl">atau masuk dengan kode</div><div class="r"><input id="ri" maxlength="5" placeholder="KODE" style="width:120px;text-transform:uppercase"><button id="rj">Masuk</button></div><button class="s bk">Kembali</button></div></div>
<div id="lobby" class="ui hide"><div class="card"><div class="lbl">Kode room</div><div id="lc" class="code"></div><div class="lbl">Pemain</div><div id="ll"></div><button id="lg">Mulai</button><button id="lx" class="d">Keluar</button></div></div>
<div id="set" class="ui hide"><div class="card"><div id="rl"></div><input type="range" id="rd" min="60" max="400"><div class="lbl">Objek jauh memudar</div><button id="sb" class="s">Kembali</button></div></div>
<div id="pause" class="ui hide"><div class="card"><button id="pr">Lanjut</button><button id="ps" class="s">Setting</button><button id="pe" class="d">Keluar</button></div></div>
<div id="gmsg" class="hide"></div>
<div id="hud" class="hide"><canvas id="mm" width="96" height="96"></canvas>
<button id="pb" class="ib"><svg viewBox="0 0 8 8"><rect x="1" y="1" width="2" height="6"/><rect x="5" y="1" width="2" height="6"/></svg></button>
<button id="cb" class="ib"><svg viewBox="0 0 8 8"><rect x="0" y="1" width="8" height="5"/><rect x="1" y="6" width="2" height="2"/></svg></button>
<div id="bar"></div>
<div id="jbhud"><i></i><span id="jbn">0 JB</span></div>
<div id="prompt" class="hide"></div>
<div id="rankHUD" class="hide"></div>
<div id="posList" class="hide"></div>
<div id="raceTimer" class="hide">0.00s</div><div id="rbar" class="hide"><i></i></div><div id="cd" class="hide"></div>
<div id="mob" class="hide"><div id="joy"><i id="kn"></i></div><button id="jb">JUMP</button><button id="rb" class="s">RUN</button></div>
<div id="chat" class="hide"><input id="ci" maxlength="60" placeholder="Pesan (atau /g pesan global)"><button id="cs">Kirim</button></div></div>
<script src="three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
