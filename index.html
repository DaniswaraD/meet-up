<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fd0ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kelompok 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#8fd0ff;font-family:'Press Start 2P',monospace;color:#17306b;-webkit-font-smoothing:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#dt{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px}
#dt i{display:block;width:8px;height:8px;background:#f4f9ff;box-shadow:0 0 0 2px #17306b;transition:background .25s,transform .25s}
#dt i.on{background:#ffd23f;transform:translateY(-4px)}
#cn{position:absolute;right:20px;bottom:22px;font-size:8px;color:#17306b;opacity:.7;font-variant-numeric:tabular-nums}
#install{position:absolute;top:16px;right:16px;pointer-events:auto;display:none;align-items:center;gap:8px;padding:8px 12px;background:#f4f9ff;border:0;font:inherit;font-size:8px;color:#17306b;cursor:pointer;box-shadow:0 0 0 3px #17306b;letter-spacing:.06em}
#install.show{display:flex}
#install:active{transform:translateY(2px)}
#install svg{width:12px;height:12px;stroke:#17306b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#boot{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#8fd0ff;font-size:9px;color:#17306b;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
@media(max-width:640px){#cn{bottom:14px;right:14px;font-size:7px}#dt{bottom:14px}#install{top:12px;right:12px;font-size:7px;padding:7px 10px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <button id="install" aria-label="Install">
    <svg viewBox="0 0 24 24"><path d="M12 3v13M6 12l6 6 6-6M5 21h14"/></svg>
    INSTALL
  </button>
  <div id="dt"></div>
  <div id="cn">01 / 08</div>
</div>
<div id="boot">MEMUAT…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
<script>
(function(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js');
  }

  let deferred = null;
  const btn = document.getElementById('install');

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    btn.classList.add('show');
  });

  btn.addEventListener('click', async () => {
    if(!deferred) return;
    btn.classList.remove('show');
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    if(outcome === 'accepted'){
      setTimeout(() => location.reload(), 300);
    }
  });

  window.addEventListener('appinstalled', () => {
    btn.classList.remove('show');
    deferred = null;
  });
})();
</script>
</body>
</html>
