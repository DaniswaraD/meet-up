<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8fd0ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kelompok 2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kelompok 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#8fd0ff;font-family:'Press Start 2P',monospace;color:#17306b;-webkit-font-smoothing:none}
:root{--k:#17306b;--bl:#3a8dff;--yl:#ffd23f;--rd:#e22;--bd:0 0 0 4px #17306b,0 6px 0 #0005}

/* Canvas utama Three.js — HARUS id="c" karena game.js baca $('c') */
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}

/* Layar UI */
.ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,26,58,.78);z-index:10;padding:20px}
.ui.hide{display:none}
.card{background:#f4f9ff;padding:18px;box-shadow:var(--bd);display:flex;flex-direction:column;gap:10px;max-width:min(90vw,440px);max-height:88vh;overflow-y:auto}
.card .lbl{font-size:9px;color:#17306b;letter-spacing:2px;text-align:center;margin:6px 0 2px}
.card .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.card .grid button,.card>button{font:inherit;font-size:9px;padding:9px 10px;background:#fff;color:#17306b;border:0;box-shadow:0 0 0 3px #17306b,0 3px 0 #0005;cursor:pointer;letter-spacing:1px;transition:filter .1s,transform .1s}
.card .grid button:active,.card>button:active{transform:translateY(2px);filter:brightness(.94)}
.card .grid button.on{background:#ffd23f}
.card .grid button small{display:block;font-size:6px;line-height:1.3;margin-top:3px;opacity:.7}
.card .grid button small.on-live{color:#3fbf5f;opacity:1}
.card>button.d{background:#ff5d5d;color:#fff}
.card input[type=text],.card input:not([type]){font:inherit;font-size:11px;padding:12px;background:#fff;color:#17306b;border:0;box-shadow:0 0 0 3px #17306b;text-align:center;letter-spacing:1px;width:100%}

/* Baris pemain di lobby */
.row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;box-shadow:0 2px 0 #0002;font-size:9px}
.row i{flex:none;width:18px;height:18px;display:block;box-shadow:0 0 0 2px #17306b}
.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:normal}
.row .kick{flex:none;width:24px;height:24px;background:#ff5d5d;color:#fff;border:0;font:inherit;font-size:11px;font-weight:bold;box-shadow:0 0 0 2px #17306b;cursor:pointer}

/* Menu utama */
#menu{flex-direction:row!important;align-items:center!important;justify-content:space-between!important;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))!important;gap:20px}
#menu .ttl{width:min(48vw,420px)!important;flex-shrink:0;margin:0!important}
#menu .menu-right{display:flex;flex-direction:column;gap:14px;width:min(42vw,320px);margin-left:auto;max-height:calc(100vh - 40px);overflow-y:auto;padding:4px}
#menu .menu-right .mb{font:inherit;font-size:11px;padding:14px 12px;background:#f4f9ff;color:#17306b;border:0;box-shadow:var(--bd);cursor:pointer;letter-spacing:1px;transition:filter .1s;text-align:center}
#menu .menu-right .mb:active{transform:translateY(3px);filter:brightness(.94)}
#menu .menu-right::-webkit-scrollbar{width:4px}
#menu .menu-right::-webkit-scrollbar-thumb{background:#17306b}

/* Judul piksel (canvas di-render oleh game.js) */
.ttl{display:block;width:220px;height:44px;image-rendering:pixelated}
#load .ttl{width:min(60vw,400px);height:auto}
#menu .ttl{width:min(48vw,420px)!important;height:auto}
#name .ttl{margin:0 auto;width:min(50vw,260px);height:auto}

/* HUD in-game */
#hud{position:fixed;inset:0;pointer-events:none;z-index:9}
#hud.hide{display:none}
#hud>*{pointer-events:auto}
#mm{position:absolute;top:16px;right:16px;width:96px;height:96px;background:#17306b;box-shadow:0 0 0 3px #17306b,0 0 0 6px #7fd0ff;image-rendering:pixelated}
#jbn{position:absolute;top:16px;left:16px;font-size:11px;color:#17306b;background:#fff;padding:8px 12px;box-shadow:0 0 0 3px #17306b;letter-spacing:1px}
#pb{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:42px;height:42px;background:#fff;color:#17306b;border:0;font:inherit;font-size:14px;box-shadow:0 0 0 3px #17306b;cursor:pointer}
#raceTimer{position:absolute;top:66px;left:50%;transform:translateX(-50%);font-size:10px;background:#fff;padding:8px 14px;box-shadow:0 0 0 3px #17306b;letter-spacing:1px;white-space:nowrap}
#raceTimer.hide{display:none}
#rbar{position:absolute;top:110px;left:50%;transform:translateX(-50%);width:240px;height:14px;background:#17306b;box-shadow:0 0 0 3px #17306b,0 0 0 6px #7fd0ff}
#rbar.hide{display:none}
#rbar>div{height:100%;width:0%;background:linear-gradient(90deg,#ffd23f,#3fbf5f);transition:width .1s}
#cd{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:60px;color:#ffd23f;text-shadow:0 0 0 8px #17306b,4px 4px 0 #17306b;pointer-events:none}
#cd.hide{display:none}
#bar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:4px;background:rgba(23,48,107,.35);box-shadow:0 0 0 3px #17306b}
#bar button{width:44px;height:44px;background:#fff;border:0;box-shadow:0 0 0 2px #17306b;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font:inherit;padding:0}
#bar button canvas{width:26px;height:26px;image-rendering:pixelated}
#bar button small{position:absolute;bottom:1px;right:3px;font-size:6px;color:#17306b;font-weight:bold}
#bar button b{font-size:15px;line-height:1}
#bar button.on{background:#ffd23f;transform:translateY(-3px)}

/* Prompt / toast */
#prompt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(23,48,107,.95);color:#fff;padding:10px 18px;font-size:11px;box-shadow:0 0 0 3px #ffd23f,0 4px 0 #0005;z-index:11;display:none;text-align:center;max-width:80vw}
#prompt.show{display:block}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#17306b;color:#fff;padding:12px 20px;font-size:9px;box-shadow:0 0 0 3px #ffd23f,0 4px 0 #0005;z-index:15;max-width:80vw;text-align:center;line-height:1.6}
#toast.hide{display:none}

/* Kontrol mobile */
#mob{position:fixed;inset:0;pointer-events:none;z-index:8}
#mob.hide{display:none}
#joy{position:absolute;bottom:16px;left:16px;width:124px;height:124px;background:rgba(23,48,107,.35);border-radius:50%;box-shadow:0 0 0 3px #17306b;pointer-events:auto;touch-action:none}
#kn{position:absolute;left:42px;top:42px;width:40px;height:40px;background:#7fd0ff;border-radius:50%;box-shadow:0 0 0 3px #17306b;pointer-events:none}
#jb,#ab,#rb,#cb{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff;color:#17306b;border:0;font:inherit;font-size:9px;font-weight:bold;box-shadow:0 0 0 3px #17306b;cursor:pointer;pointer-events:auto;letter-spacing:0;touch-action:none;padding:0}
#jb{bottom:40px;right:100px}
#ab{bottom:110px;right:24px;background:#ff5d5d;color:#fff}
#rb{bottom:16px;right:24px;width:56px;height:56px}
#rb.s{background:#3fbf5f;color:#fff}
#cb{bottom:16px;left:50%;transform:translateX(-50%);width:48px;height:48px;font-size:18px;border-radius:12px}

/* Chat */
#ci{font:inherit;font-size:11px;padding:12px;background:#fff;color:#17306b;border:0;box-shadow:0 0 0 3px #17306b;width:100%;letter-spacing:1px;text-align:center}

/* Kode room */
#lc{font-size:18px;letter-spacing:6px;text-align:center;color:#ffd23f;background:#17306b;padding:14px;box-shadow:0 0 0 3px #17306b;text-indent:6px}
#lg{background:#3fbf5f!important;color:#fff!important}

/* Loading */
#load{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#8fd0ff;color:#17306b;gap:22px;transition:opacity .5s}
#load.hide{opacity:0;pointer-events:none}
#loadTrack{width:min(60vw,300px);height:22px;background:#fff;box-shadow:0 0 0 3px #17306b,0 0 0 6px #7fd0ff;padding:2px}
#loadBar{height:100%;width:0%;background:linear-gradient(90deg,#ffd23f,#3fbf5f);transition:width .3s}
#loadMsg{font-size:10px;letter-spacing:2px;text-align:center;max-width:80vw}

/* Responsive */
@media(max-width:640px){
  .card{padding:14px;gap:8px}
  .card .grid{grid-template-columns:repeat(3,1fr);gap:5px}
  .card .grid button{font-size:8px;padding:7px 6px}
  #mm{width:72px;height:72px}
  #jbn{font-size:9px;padding:6px 10px}
}
@media(max-height:430px){
  #menu{padding:14px 3vw!important;gap:12px}
  #menu .ttl{width:min(42vw,320px)!important}
  #menu .menu-right{width:min(46vw,300px);gap:10px}
  #menu .menu-right .mb{font-size:10px;padding:10px 10px}
  .card{padding:12px;gap:7px}
  .card .grid button{font-size:7px;padding:6px 5px}
  .row{font-size:8px;padding:5px 8px}
}
</style>
</head>
<body>

<!-- Canvas Three.js — WAJIB id="c" -->
<canvas id="c"></canvas>

<!-- ============ LOADING ============ -->
<div id="load">
  <canvas class="ttl"></canvas>
  <div id="loadTrack"><div id="loadBar"></div></div>
  <div id="loadMsg">MEMUAT…</div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="hide"></div>

<!-- ============ LAYAR NAMA ============ -->
<div id="name" class="ui">
  <div class="card">
    <canvas class="ttl"></canvas>
    <div class="lbl">Nama Kamu</div>
    <input id="nm" maxlength="14" placeholder="Ketik nama…">
    <button id="ng">MULAI</button>
  </div>
</div>

<!-- ============ MENU UTAMA ============ -->
<div id="menu" class="ui hide">
  <canvas class="ttl"></canvas>
  <div class="menu-right">
    <button class="mb" id="mp">MAIN</button>
    <button class="mb" id="ms">SKIN</button>
    <button class="mb" id="mr">ROOM</button>
    <button class="mb" id="mt">SETELAN</button>
  </div>
</div>

<!-- ============ PILIH MAP ============ -->
<div id="playpick" class="ui hide">
  <div class="card">
    <div class="lbl">PILIH MAP</div>
    <div class="grid" id="playMaps" style="grid-template-columns:repeat(2,1fr)"></div>
    <button id="ppbk">KEMBALI</button>
  </div>
</div>

<!-- ============ SKIN ============ -->
<div id="skin" class="ui hide">
  <div class="card" style="max-width:min(92vw,480px)">
    <div class="lbl">WARNA BADAN</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label style="font-size:8px;display:flex;flex-direction:column;gap:4px">Warna 1<input type="color" id="c1" style="height:38px;border:0;cursor:pointer;padding:0"></label>
      <label style="font-size:8px;display:flex;flex-direction:column;gap:4px">Warna 2<input type="color" id="c2" style="height:38px;border:0;cursor:pointer;padding:0"></label>
    </div>
    <div class="lbl">WARNA NAMA</div>
    <input type="color" id="nc" style="height:38px;border:0;cursor:pointer;padding:0">
    <div class="lbl">BENTUK</div>
    <div class="grid" id="shapes"></div>
    <div class="lbl">TOPI</div>
    <div class="grid" id="hats"></div>
    <div class="lbl">FONT NAMA</div>
    <div class="grid" id="fonts" style="grid-template-columns:repeat(3,1fr)"></div>
    <button class="bk">KEMBALI</button>
  </div>
</div>

<!-- ============ BUAT / GABUNG ROOM ============ -->
<div id="croom" class="ui hide">
  <div class="card">
    <div class="lbl">PILIH MAP ROOM</div>
    <div class="grid" id="maps" style="grid-template-columns:repeat(3,1fr)"></div>
    <button id="rc">BUAT ROOM</button>
    <div class="lbl">GABUNG ROOM</div>
    <input id="ri" maxlength="5" placeholder="KODE" style="text-transform:uppercase">
    <button id="rj">GABUNG</button>
    <button class="bk">KEMBALI</button>
  </div>
</div>

<!-- ============ LOBBY ============ -->
<div id="lobby" class="ui hide">
  <div class="card" style="width:min(92vw,380px)">
    <div class="lbl">KODE ROOM</div>
    <div id="lc">-----</div>
    <div class="lbl">PEMAIN</div>
    <div id="ll" style="display:flex;flex-direction:column;gap:6px"></div>
    <button id="lg" class="hide">MULAI</button>
    <button id="lx" class="d">KELUAR</button>
  </div>
</div>

<!-- ============ SETELAN ============ -->
<div id="set" class="ui hide">
  <div class="card">
    <div class="lbl">JARAK RENDER</div>
    <div style="display:flex;gap:10px;align-items:center;padding:8px 4px">
      <input type="range" id="rd" min="60" max="300" step="20" style="flex:1">
      <span id="rl" style="font-size:9px;white-space:nowrap">Render: 180J</span>
    </div>
    <button id="sb">SIMPAN</button>
  </div>
</div>

<!-- ============ PAUSE ============ -->
<div id="pause" class="ui hide">
  <div class="card">
    <div class="lbl">PAUSE</div>
    <button id="pr">LANJUT</button>
    <button id="ps">SETELAN</button>
    <button id="pe" class="d">KELUAR ROOM</button>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div id="chat" class="ui hide">
  <div class="card">
    <div class="lbl">CHAT</div>
    <input id="ci" maxlength="60" placeholder="Ketik pesan…">
    <div style="display:flex;gap:8px">
      <button id="cs" style="flex:1">KIRIM</button>
      <button onclick="document.getElementById('chat').classList.add('hide')" style="flex:1">TUTUP</button>
    </div>
  </div>
</div>

<!-- ============ HUD IN-GAME ============ -->
<div id="hud" class="hide">
  <canvas id="mm" width="96" height="96"></canvas>
  <div id="jbn">0 JB</div>
  <button id="pb">☰</button>
  <div id="raceTimer" class="hide">0.0s</div>
  <div id="rbar" class="hide"><div></div></div>
  <div id="cd" class="hide"></div>
  <div id="bar"></div>
</div>

<!-- Prompt dialog Jelloger -->
<div id="prompt"></div>

<!-- ============ KONTROL MOBILE ============ -->
<div id="mob" class="hide">
  <div id="joy"><div id="kn"></div></div>
  <button id="jb">JUMP</button>
  <button id="ab">HIT</button>
  <button id="rb">RUN</button>
  <button id="cb">💬</button>
</div>

<!-- ============ SCRIPT ============ -->
<script src="three.min.js"></script>
<script src="game.js"></script>

<script>
/* Service worker (kalau game.js juga register, biarkan — tidak apa-apa dobel) */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{scope:'./'})
      .then(r=>console.log('[SW] OK:',r.scope))
      .catch(e=>console.error('[SW] Gagal:',e));
  });
}
</script>

</body>
</html>
