<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#3a8dff"><link rel="manifest" href="manifest.json"><title>Meet-UP</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--b:#2f7bff;--ink:#17306b;--soft:#e8f2ff}
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#8fd0ff;font:900 15px/1.2 Nunito,ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px 18px;pointer-events:none;animation:in .25s}
.ui>*{pointer-events:auto}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.hide{display:none!important}
#menu{justify-content:space-between}
.ttl{width:min(86vw,520px);image-rendering:pixelated;filter:drop-shadow(0 6px 10px #1d4ed860)}
.card{background:#ffffffe8;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid #fff;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;width:min(92vw,340px);max-height:84vh;overflow:auto;box-shadow:0 14px 34px #17306b45}
.card,.card *{touch-action:pan-y}
button{font:inherit;color:#fff;border:0;border-radius:18px;padding:13px 18px;background:linear-gradient(#5db5ff,var(--b));box-shadow:0 4px 0 #1f56c4,0 8px 14px #17306b30;cursor:pointer;transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:6px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #1f56c4}button:disabled{opacity:.6}
button.s{background:#fff;color:var(--b);box-shadow:0 4px 0 #c3d6f3,0 8px 14px #17306b20}
button.d{background:linear-gradient(#ff8a8a,#e5484d);box-shadow:0 4px 0 #b32b30}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
input,select{font:inherit;color:var(--ink);background:#fff;border:2px solid #cfe0f7;border-radius:14px;padding:12px 14px;outline:0;min-width:0}
input:focus,select:focus{border-color:#4aa8ff;box-shadow:0 0 0 4px #4aa8ff33}
input[type=color]{padding:3px;width:64px;height:42px;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch,input[type=color]::-moz-color-swatch{border:0;border-radius:10px}
input[type=range]{padding:0;accent-color:var(--b);height:28px;border:0;box-shadow:none;background:none}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between}.lbl{font-size:12px;opacity:.6;text-transform:uppercase;letter-spacing:1px}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,360px)}.mb .big{grid-column:1/3;font-size:21px;padding:17px}
.code{font-size:32px;letter-spacing:7px;text-align:center;background:var(--soft);border-radius:18px;padding:10px}
#ll{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:8px 10px}
.row i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0003}.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kick{width:34px;height:34px;padding:0;border-radius:50%;background:linear-gradient(#ff8a8a,#e5484d);box-shadow:0 3px 0 #b32b30}.kick svg{width:16px;height:16px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#17306bf2;color:#fff;padding:12px 20px;border-radius:999px;z-index:9;max-width:92vw;text-align:center;box-shadow:0 8px 20px #0004}
#hud>*,#mob>*{position:fixed}
.ib{width:46px;height:46px;padding:0;border-radius:50%;background:#ffffffe0;color:var(--b);box-shadow:0 4px 12px #17306b40}
#pb{top:max(10px,env(safe-area-inset-top));left:10px}#cb{top:max(10px,env(safe-area-inset-top));left:64px}
#mm{top:max(10px,env(safe-area-inset-top));right:10px;width:104px;height:104px;border-radius:20px;border:3px solid #fff;box-shadow:0 6px 16px #17306b50;image-rendering:pixelated}
#bar{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:#ffffffcc;backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 8px 20px #17306b50}
#bar button{position:relative;width:min(10vw,48px);height:min(10vw,48px);padding:0;font-size:min(5.4vw,24px);background:#fff;border-radius:16px;box-shadow:0 3px 0 #c3d6f3}
#bar small{position:absolute;left:5px;top:2px;font:900 10px sans-serif;color:var(--b)}#bar .on{background:#ffe27a;transform:translateY(-5px)}
#chat{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 68px);left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(92vw,420px);padding:8px;background:#ffffffe8;border-radius:22px;box-shadow:0 8px 20px #17306b50}#ci{flex:1}
#joy{left:22px;bottom:84px;width:120px;height:120px;border-radius:50%;background:#ffffff66;border:3px solid #ffffffcc;backdrop-filter:blur(4px)}
#kn{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:var(--b);box-shadow:0 3px 8px #17306b60}
#jb,#rb{border-radius:50%;padding:0}#jb{right:22px;bottom:96px;width:72px;height:72px}#rb{right:30px;bottom:180px;width:56px;height:56px}#jb svg,#rb svg{width:30px;height:30px}
@media(orientation:landscape){#skin,#set{align-items:flex-end;padding-right:28px}}
@media(max-height:430px){.ttl{width:min(56vw,340px)}.mb .big{padding:12px;font-size:18px}button{padding:10px 14px}.mb{gap:8px}}
</style></head><body>
<canvas id="c"></canvas><div id="toast" class="hide"></div>
<div id="name" class="ui"><canvas class="ttl"></canvas><div class="card"><div class="lbl">Username</div><input id="nm" maxlength="14" placeholder="Nama Jello kamu" autocomplete="off"><button id="ng">Lanjut</button></div></div>
<div id="menu" class="ui hide"><canvas class="ttl"></canvas><div class="mb"><button id="mp" class="big">Play</button><button id="ms" class="s">Custom Skin</button><button id="mr" class="s">Custom Room</button><button id="mt" class="s">Setting</button><button id="md" class="s">Download</button></div></div>
<div id="skin" class="ui hide"><div class="card"><div class="r">Warna 1<input type="color" id="c1"></div><div class="r">Warna 2 (gradient)<input type="color" id="c2"></div>
<div class="r">Bentuk<select id="sh"><option value="0">Setengah bulat</option><option value="1">Kotak</option><option value="2">Segitiga</option></select></div>
<div class="r">Warna nametag<input type="color" id="nc"></div><div class="r">Font<select id="nf"><option>monospace</option><option>serif</option><option>sans-serif</option><option>cursive</option></select></div><button class="s bk">Kembali</button></div></div>
<div id="croom" class="ui hide"><div class="card"><div class="r">Map<select id="rm"><option value="island">Pulau</option><option value="desert">Gurun</option><option value="forest">Hutan</option><option value="snow">Salju</option></select></div><button id="rc">Buat Room</button><div class="lbl">atau masuk dengan kode</div><div class="r"><input id="ri" maxlength="5" placeholder="KODE" style="width:130px;text-transform:uppercase"><button id="rj">Masuk</button></div><button class="s bk">Kembali</button></div></div>
<div id="lobby" class="ui hide"><div class="card"><div class="lbl">Kode room</div><div id="lc" class="code"></div><div class="lbl">Pemain</div><div id="ll"></div><button id="lg">Mulai</button><button id="lx" class="d">Keluar</button></div></div>
<div id="set" class="ui hide"><div class="card"><div id="rl"></div><input type="range" id="rd" min="25" max="1000"><div class="lbl">Objek di luar jangkauan memudar</div><button id="sb" class="s">Kembali</button></div></div>
<div id="pause" class="ui hide"><div class="card"><button id="pr">Lanjut</button><button id="ps" class="s">Setting</button><button id="pe" class="d">Keluar</button></div></div>
<div id="hud" class="hide"><canvas id="mm" width="96" height="96"></canvas>
<button id="pb" class="ib"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button><button id="cb" class="ib"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button><div id="bar"></div>
<div id="mob" class="hide"><div id="joy"><i id="kn"></i></div><button id="jb"><svg viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6"/></svg></button><button id="rb" class="s"><svg viewBox="0 0 24 24"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button></div>
<div id="chat" class="hide"><input id="ci" maxlength="60" placeholder="Ketik pesan"><button id="cs">Kirim</button></div></div>
<script src="three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="game.js"></script></body></html>
